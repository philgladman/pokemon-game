start_map: pallet_town
player_appearance: character.player

tile_definitions:
  - id: path
    walkable: true
    appearance: tile.path
  - id: grass
    walkable: true
    appearance: tile.grass
  - id: water
    walkable: false
    surfable: true
    appearance: tile.water
  - id: tree
    walkable: false
    appearance: tile.tree
  - id: building
    walkable: false
    appearance: tile.building
  - id: floor
    walkable: true
    appearance: tile.floor
  - id: wall
    walkable: false
    appearance: tile.wall
  - id: rug
    walkable: true
    appearance: tile.rug

maps:
  - id: pallet_town
    name: Pallet Town
    source_map: pallet_town
    player_spawn: {x: 5, y: 7}
    terrain_tiles:
      walkable: path
      grass: grass
      water: water
      blocked: tree
    visual_overrides:
      # Only presentation changes here; the compiler prevents collision changes.
      - {position: {x: 4, y: 3}, tile: building}
      - {position: {x: 5, y: 3}, tile: building}
      - {position: {x: 6, y: 3}, tile: building}
      - {position: {x: 7, y: 3}, tile: building}
      - {position: {x: 4, y: 4}, tile: building}
      - {position: {x: 5, y: 4}, tile: building}
      - {position: {x: 6, y: 4}, tile: building}
      - {position: {x: 7, y: 4}, tile: building}
      - {position: {x: 4, y: 5}, tile: building}
      - {position: {x: 6, y: 5}, tile: building}
      - {position: {x: 7, y: 5}, tile: building}
      - {position: {x: 12, y: 3}, tile: building}
      - {position: {x: 13, y: 3}, tile: building}
      - {position: {x: 14, y: 3}, tile: building}
      - {position: {x: 15, y: 3}, tile: building}
      - {position: {x: 12, y: 4}, tile: building}
      - {position: {x: 13, y: 4}, tile: building}
      - {position: {x: 14, y: 4}, tile: building}
      - {position: {x: 15, y: 4}, tile: building}
