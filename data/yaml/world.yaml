      - {position: {x: 15, y: 11}, tile: building}
    npcs:
      - source_object: pallettown_girl
        id: town_gardener
        name: Mira
        facing: east
        appearance: character.town_gardener
        dialog:
          - The flowers grow best when everyone takes care of the town.
          - Someday I want to explore beyond the northern path.
      - source_object: pallettown_fisher
        id: town_technologist
        name: Theo
        facing: west
        appearance: character.town_technologist
        dialog:
          - Imagine storing a whole adventure as data. Technology is remarkable!
    transitions:
      - source_position: {x: 5, y: 5}
        target_facing: north

  - id: reds_house_1f
    name: Player's House
    source_map: reds_house_1f
    terrain_tiles:
      walkable: floor
      grass: floor
      water: floor
      blocked: wall
    visual_overrides:
      - {position: {x: 2, y: 6}, tile: rug}
      - {position: {x: 3, y: 6}, tile: rug}
      - {position: {x: 2, y: 7}, tile: rug}
      - {position: {x: 3, y: 7}, tile: rug}
    npcs:
      - source_object: redshouse1f_mom
        id: parent
        name: Mom
        appearance: character.parent
        dialog:
          - Welcome home. The town is especially peaceful today.
    transitions:
      - source_position: {x: 2, y: 7}
        last_map_context: pallet_town
        target_facing: south
      - source_position: {x: 3, y: 7}
        last_map_context: pallet_town
        target_facing: south
