<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f380f" />
    <title>Pokémon Red — Pallet Town</title>
  </head>
  <body>
    <main id="app">
      <canvas id="world" aria-label="Retro view of Pallet Town"></canvas>
      <div id="transition-overlay" class="transition-overlay" hidden></div>
      <section class="hud" aria-live="polite">
        <div>
          <h1 id="map-name">Connecting…</h1>
          <p>Move: WASD / arrows · Interact: E / Space</p>
        </div>
        <span id="connection-status">Connecting</span>
      </section>
      <section id="dialog" class="dialog hidden" aria-live="assertive">
        <p id="dialog-line"></p>
        <small>E / Space to continue</small>
      </section>
      <section id="choice" class="choice hidden" aria-live="assertive">
        <p id="choice-prompt"></p>
        <ol id="choice-options"></ol>
        <small>↑/↓ select · E / Space confirm · Esc cancel</small>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
