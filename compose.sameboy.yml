services:
  sameboy:
    build:
      context: sameboy
    init: true
    ports:
      - "127.0.0.1:${SAMEBOY_PORT:-8081}:8081"
    environment:
      SAMEBOY_MODEL: ${SAMEBOY_MODEL:-cgb-e}
    volumes:
      - type: bind
        source: ${SAMEBOY_ROM:-./.cache/oracle/build/pokered/pokered.gbc}
        target: /rom/pokered.gbc
        read_only: true
        bind:
          create_host_path: false
      - profile:/profile
    stop_grace_period: 25s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "/app/run.py", "--health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  profile:
